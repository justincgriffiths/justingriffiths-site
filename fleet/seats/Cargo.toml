[package]
name = "seats"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The /fleet/seats/ page: the envelope flow between seats, latest state per card, and what waits on Justin"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "seats"
path = "src/main.rs"

[dependencies]
fleet-scene = { path = "..", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "dd0888d11bdf9bf24e98a35087f15f803336f405" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
