[workspace]
members = [".", "battle-school"]
[package]
name = "fleet-scene"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The /fleet/ scene: battle school and the Bike Factory, drawn by Rune from a fleet-state JSON"

[features]
# The wasm `start` entry. battle-school links this crate as a library and has its own, so it turns this off.
default = ["start"]
start = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fleet-scene"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pinned to a rev of `dev` (2026-11-07, "Text fields: a one-line field's placeholder...").
rune = { git = "https://github.com/anomalyco/rune", rev = "dd0888d11bdf9bf24e98a35087f15f803336f405" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned to the wasm-bindgen CLI version Rune's own lock carries (web-build.sh checks they match).
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
