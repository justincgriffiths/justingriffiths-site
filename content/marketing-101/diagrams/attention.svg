<svg viewBox="0 0 760 228" role="img" aria-label="Platforms sell your attention to advertisers" font-size="13"><defs><marker id="att-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Platforms sell your attention to advertisers</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M300 106H184" marker-end="url(#att-arrow)"></path><path d="M184 134H300" marker-end="url(#att-arrow)"></path><path d="M460 106H576" marker-end="url(#att-arrow)"></path><path d="M576 134H460" marker-end="url(#att-arrow)"></path></g><text x="242" y="98" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">free content</text><text x="242" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">attention</text><text x="518" y="98" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">resold attention</text><text x="518" y="152" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">money (CPM)</text><g><rect x="24" y="84" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="104" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">You (users)</text><text x="104" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">pay with attention</text></g><g><rect x="300" y="84" width="160" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Platform</text><text x="380" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Twitch, TikTok,</text><text x="380" y="144" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">YouTube, Google</text></g><g><rect x="576" y="84" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="656" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Advertisers</text><text x="656" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">pay with money</text></g><text x="380" y="204" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">The price of attention is set in an auction, impression by impression.</text></svg>
