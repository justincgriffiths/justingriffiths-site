<svg viewBox="0 0 760 316" role="img" aria-label="The cost of a sale splits into three numbers" font-size="13"><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">The cost of a sale splits into three numbers</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">CPA = CPM ÷ (1,000 × CTR × CVR). Illustrative numbers.</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M204 168H300V96H400"></path><path d="M204 168H400"></path><path d="M300 168V240H400"></path></g><text x="350" y="88" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">÷ 1,000</text><text x="350" y="160" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">÷ CTR</text><text x="350" y="232" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">÷ CVR</text><g><rect x="24" y="124" width="180" height="88" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="114" y="156" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">CPA</text><text x="114" y="182" text-anchor="middle" font-size="22" font-weight="600" fill="var(--cds-text-primary)">$33.33</text><text x="114" y="202" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">cost of one sale</text></g><g><rect x="400" y="68" width="220" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="416" y="92" font-weight="600" fill="var(--cds-text-primary)">CPM  $10</text><text x="416" y="110" font-size="11.5" fill="var(--cds-text-secondary)">price of 1,000 views</text></g><g><rect x="400" y="140" width="220" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="416" y="164" font-weight="600" fill="var(--cds-text-primary)">CTR  1%</text><text x="416" y="182" font-size="11.5" fill="var(--cds-text-secondary)">share of viewers who click</text></g><g><rect x="400" y="212" width="220" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="416" y="236" font-weight="600" fill="var(--cds-text-primary)">CVR  3%</text><text x="416" y="254" font-size="11.5" fill="var(--cds-text-secondary)">share of clickers who buy</text></g><g><text x="640" y="100" font-size="11.5" fill="var(--cds-text-secondary)">Awareness</text><text x="640" y="172" font-size="11.5" fill="var(--cds-text-secondary)">Consideration</text><text x="640" y="244" font-size="11.5" fill="var(--cds-text-secondary)">Conversion</text></g><text x="24" y="300" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">CPA jumps from $33 to $50? Ask which of the three boxes moved, not why CPA is up.</text></svg>
