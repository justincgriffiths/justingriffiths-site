<svg viewBox="0 0 760 308" role="img" aria-label="Three lenses from these sessions to try on the thesis" font-size="12.5"><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Three lenses from these sessions to try on the thesis</text><g><rect x="24" y="54" width="712" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="var(--cds-text-primary)">Thesis topic: [THESIS TOPIC]</text></g><g><line x1="132" y1="104" x2="132" y2="128" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><rect x="24" y="128" width="216" height="156" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="40" y1="172" x2="224" y2="172" stroke="var(--cds-chart-grid)"></line><text x="132" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="var(--cds-text-primary)">Draw the funnel</text><text x="40" y="196" fill="var(--cds-text-primary)">Who are the customers?</text><text x="40" y="218" fill="var(--cds-text-primary)">What are their stages?</text><text x="40" y="240" fill="var(--cds-text-primary)">Which stage would you</text><text x="40" y="258" fill="var(--cds-text-primary)">measure?</text></g><g><line x1="380" y1="104" x2="380" y2="128" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><rect x="272" y="128" width="216" height="156" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="288" y1="172" x2="472" y2="172" stroke="var(--cds-chart-grid)"></line><text x="380" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="var(--cds-text-primary)">Find the attention market</text><text x="288" y="196" fill="var(--cds-text-primary)">Whose attention is scarce?</text><text x="288" y="218" fill="var(--cds-text-primary)">Who sells it?</text><text x="288" y="240" fill="var(--cds-text-primary)">Is there a price you</text><text x="288" y="258" fill="var(--cds-text-primary)">could observe?</text></g><g><line x1="628" y1="104" x2="628" y2="128" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><rect x="520" y="128" width="216" height="156" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="536" y1="172" x2="720" y2="172" stroke="var(--cds-chart-grid)"></line><text x="628" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="var(--cds-text-primary)">Pick a moment of truth</text><text x="536" y="196" fill="var(--cds-text-primary)">ZMOT, FMOT or SMOT:</text><text x="536" y="218" fill="var(--cds-text-primary)">which one decides?</text><text x="536" y="240" fill="var(--cds-text-primary)">What data would</text><text x="536" y="258" fill="var(--cds-text-primary)">show it?</text></g></svg>
