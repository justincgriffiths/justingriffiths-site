<svg viewBox="0 0 760 348" role="img" aria-label="Apple ads sold the why; the computer came last" font-size="13"><defs><marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Apple's ads sold the why; the computer came last</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M244 100H270" marker-end="url(#ap-arrow)"></path><path d="M490 100H516" marker-end="url(#ap-arrow)"></path><path d="M134 136V180" marker-end="url(#ap-arrow)"></path><path d="M134 152H564V180" marker-end="url(#ap-arrow)"></path></g><g><rect x="24" y="64" width="220" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.14" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="134" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">WHY</text><text x="134" y="106" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">&quot;challenging the status quo,&quot;</text><text x="134" y="122" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">&quot;thinking differently&quot;</text></g><g><rect x="270" y="64" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">HOW</text><text x="380" y="106" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">&quot;beautifully designed,</text><text x="380" y="122" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">simple to use&quot;</text></g><g><rect x="516" y="64" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="626" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">WHAT</text><text x="626" y="106" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">&quot;We just happen to make</text><text x="626" y="122" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">great computers.&quot;</text></g><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">Apple, in Sinek's words (TEDx, 2009)</text><g><rect x="24" y="180" width="344" height="144" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="206" font-weight="600" fill="var(--cds-text-primary)">&quot;1984&quot; · Super Bowl XVIII, Jan 22, 1984</text><text x="40" y="232" font-size="11.5" fill="var(--cds-text-primary)">Showed: a runner smashing Big Brother's screen</text><text x="40" y="254" font-size="11.5" fill="var(--cds-text-primary)">Product: named only in the closing line</text><text x="40" y="276" font-size="11.5" fill="var(--cds-text-primary)">Aired nationally once; Ridley Scott, Chiat/Day</text><text x="40" y="298" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">About 72,000 Macs sold in the first 100 days</text></g><g><rect x="392" y="180" width="344" height="144" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="408" y="206" font-weight="600" fill="var(--cds-text-primary)">&quot;Think Different&quot; · from 1997</text><text x="408" y="232" font-size="11.5" fill="var(--cds-text-primary)">Showed: Einstein, King, Picasso and 14 more</text><text x="408" y="254" font-size="11.5" fill="var(--cds-text-primary)">Product: none in the TV spot or the posters</text><text x="408" y="276" font-size="11.5" fill="var(--cds-text-primary)">Launched months after Jobs returned to Apple</text><text x="408" y="298" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Fiscal 1997: $1B loss. Fiscal 1998: $309M profit</text></g></svg>
