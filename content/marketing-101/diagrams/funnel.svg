<svg viewBox="0 0 760 388" role="img" aria-label="Of a million people who see the ad, 90 come back to buy again" font-size="13"><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Of a million people who see the ad, 90 come back to buy again</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">Bar width = people left at each stage, to scale. Illustrative numbers, not a benchmark.</text><g><rect x="162" y="80" width="420" height="32" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.85"></rect><text x="600" y="101" font-size="15" font-weight="600" fill="var(--cds-text-primary)">1,000,000</text></g><g><rect x="369.9" y="152" width="4.2" height="32" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.85"></rect><text x="600" y="173" font-size="15" font-weight="600" fill="var(--cds-text-primary)">10,000</text><text x="372" y="142" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-chart-status-critical)">1% carry on</text></g><g><rect x="370" y="224" width="4" height="32" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.85"></rect><text x="600" y="245" font-size="15" font-weight="600" fill="var(--cds-text-primary)">300</text><text x="372" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-chart-status-critical)">3% carry on</text></g><g><rect x="370" y="296" width="4" height="32" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.85"></rect><text x="600" y="317" font-size="15" font-weight="600" fill="var(--cds-text-primary)">90</text><text x="372" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-chart-status-critical)">30% carry on</text></g><text x="24" y="101" font-weight="600" fill="var(--cds-text-primary)">Saw the ad</text><text x="24" y="173" font-weight="600" fill="var(--cds-text-primary)">Clicked</text><text x="24" y="245" font-weight="600" fill="var(--cds-text-primary)">Bought</text><text x="24" y="317" font-weight="600" fill="var(--cds-text-primary)">Came back</text><text x="24" y="372" font-size="11.5" fill="var(--cds-text-secondary)">Every stage loses people. The job is to find the stage that leaks most, and fix that one.</text></svg>
