<!-- @dsCard group="Type" viewport="720x300" name="Serif sentences, sans titles" subtitle="Newsreader for running text, Google Sans for titles, labels and controls; --shallan-sentence-face reverts it in one line" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="shallan.css">
<style>body{margin:0;padding:24px;background-color:var(--site-bg);background-image:linear-gradient(var(--site-grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--site-grid-line) 1px,transparent 1px);background-size:var(--site-grid-size) var(--site-grid-size);color:var(--site-text);font-family:var(--site-font)}.lbl{font-size:var(--text-overline);font-weight:var(--weight-bold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--site-text-soft)}
h1{margin:var(--space-2) 0;font-size:var(--text-h1);line-height:var(--leading-tight);letter-spacing:var(--tracking-tight)}
h2{margin:var(--space-6) 0 var(--space-2);font-size:var(--text-h4);line-height:var(--leading-snug)}
p{margin:0;max-width:var(--measure);font-family:var(--site-prose-font);font-size:var(--text-body-lg);line-height:var(--leading-relaxed);font-optical-sizing:auto}
code{font-family:var(--font-mono);font-size:var(--text-body-sm);color:var(--site-link)}</style></head><body>
<h1>Moving chores onto a local model</h1>
<p>That title is Google Sans 700. Sentences are set in Newsreader, a serif made for screens. Titles, labels, buttons and chart text stay in Google Sans.</p>
<h2>The toggle</h2>
<p>Set <code>--shallan-sentence-face</code> to <code>var(--font-sans)</code> and every sentence on the site goes back to sans.</p>
</body></html>
