<!-- @dsCard group="Colors" viewport="720x220" name="Night lane" subtitle="Shallan's ground, paper and accents: night-800 ground, paper boxes, teal leads, orange answers" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="shallan.css">
<style>body{margin:0;padding:24px;background-color:var(--site-bg);background-image:linear-gradient(var(--site-grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--site-grid-line) 1px,transparent 1px);background-size:var(--site-grid-size) var(--site-grid-size);color:var(--site-text);font-family:var(--site-font)}.lbl{font-size:var(--text-overline);font-weight:var(--weight-bold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--site-text-soft)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-top:var(--space-3)}
.sw{border:var(--border-width) solid var(--site-line);border-radius:var(--site-radius-inner);overflow:hidden;background:var(--site-bg-alt)}
.chip{height:56px}.sw p{margin:0;padding:var(--space-2);font-size:var(--text-caption)}.sw b{display:block}
.sw span{color:var(--site-text-soft)}</style></head><body>
<div class="lbl">Ground</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--night-900)"></div><p><b>night-900</b><span>#12121F void, shadows</span></p></div>
<div class="sw"><div class="chip" style="background:var(--night-800)"></div><p><b>night-800</b><span>#1A1A2E the ground</span></p></div>
<div class="sw"><div class="chip" style="background:var(--night-700)"></div><p><b>night-700</b><span>#23233F raised, hover</span></p></div>
<div class="sw"><div class="chip" style="background:var(--night-200)"></div><p><b>night-200</b><span>#C7C7D2 muted text</span></p></div>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><p><b>paper</b><span>#FAF8F4 text, rules, boxes</span></p></div>
<div class="sw"><div class="chip" style="background:var(--teal-500)"></div><p><b>teal-500</b><span>#5DA490 the accent</span></p></div>
<div class="sw"><div class="chip" style="background:var(--teal-400)"></div><p><b>teal-400</b><span>#79B9A7 links on night</span></p></div>
<div class="sw"><div class="chip" style="background:var(--orange-500)"></div><p><b>orange-500</b><span>#F4845F second accent</span></p></div>
</div></body></html>
