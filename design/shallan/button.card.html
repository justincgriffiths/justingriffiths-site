<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="shallan.css">
<style>body{margin:0;padding:24px;background-color:var(--site-bg);background-image:linear-gradient(var(--site-grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--site-grid-line) 1px,transparent 1px);background-size:var(--site-grid-size) var(--site-grid-size);color:var(--site-text);font-family:var(--site-font)}.lbl{font-size:var(--text-overline);font-weight:var(--weight-bold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--site-text-soft)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;margin-top:var(--space-4)}
.btn{display:inline-flex;align-items:center;min-height:var(--tap);padding:var(--space-3) var(--space-6);font:var(--weight-bold) var(--text-body)/1.2 var(--site-font);text-decoration:none;border:var(--site-box-border);border-radius:var(--site-radius-control);box-shadow:var(--site-shadow);transition:transform var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.p{background:var(--site-accent);color:var(--site-accent-ink)}.p:hover{background:var(--site-accent-hover)}
.s{background:var(--site-box);color:var(--site-box-text)}.s:hover{background:var(--site-box-alt)}
.g{background:transparent;color:var(--site-text);border:var(--border-width) solid var(--site-line)}</style></head><body>
<div class="lbl">Controls</div>
<div class="row"><a class="btn p" href="#">Book a call</a><a class="btn s" href="#">See the lab</a><a class="btn g" href="#">Show the answer</a></div>
</body></html>
